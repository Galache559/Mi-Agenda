<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Agenda</title>
<meta name="theme-color" content="#121212">

<style>
:root{
 --bg:#121212;--card:#1e1e1e;--item:#252525;--inp:#2a2a2a;
 --a:#00e676;--txt:#fff;--sub:#aaa;--bor:#333;
 --red:#ff5252;--blue:#29b6f6;--yel:#ffd740;--pink:#ff80ab;
}
*{
 box-sizing:border-box;margin:0;padding:0;
 font-family:Arial,sans-serif;
 -webkit-tap-highlight-color:transparent
}
body{background:var(--bg);color:var(--txt);padding-bottom:75px}
header{
 background:var(--card);padding:13px;text-align:center;
 border-bottom:1px solid var(--bor)
}
h1{font-size:1.2rem;color:var(--a)}
h2{font-size:1rem;color:var(--a);margin-bottom:10px}
.container{max-width:650px;margin:auto;padding:10px}

nav{
 position:fixed;bottom:0;left:0;right:0;background:var(--card);
 display:flex;border-top:1px solid var(--bor);padding:7px 0;z-index:20
}
nav button{
 width:33%;background:none;border:0;color:var(--sub);font-size:.72rem
}
nav button.active{color:var(--a);font-weight:bold}

.tab{display:none}.tab.active{display:block}

.card{
 background:var(--card);border:1px solid var(--bor);
 border-radius:11px;padding:12px;margin-bottom:10px
}
.btn{
 background:var(--a);color:#000;border:0;border-radius:7px;
 padding:10px;width:100%;font-weight:bold;cursor:pointer
}
.out{background:transparent;color:#fff;border:1px solid var(--bor)}
.sm{width:auto;padding:6px 10px;font-size:.75rem}

input,select,textarea{
 width:100%;background:var(--inp);color:#fff;
 border:1px solid var(--bor);border-radius:6px;
 padding:9px;margin:5px 0 9px;font-size:.9rem
}
textarea{min-height:70px}
label{font-size:.72rem;color:var(--sub)}

.calendar{
 display:grid;grid-template-columns:repeat(7,1fr);
 gap:3px;text-align:center
}
.week{font-size:.65rem;color:var(--sub);padding:5px}
.cal{
 height:48px;background:var(--item);border-radius:6px;
 padding:7px 2px;position:relative;cursor:pointer;font-size:.8rem
}
.cal.today{border:1px solid var(--a)}
.cal.sel{background:var(--a);color:#000;font-weight:bold}
.dot{
 position:absolute;bottom:3px;left:0;right:0;font-size:.55rem
}

.event{
 background:var(--item);border-left:4px solid var(--a);
 border-radius:7px;padding:9px;margin-bottom:7px
}
.cita{border-color:var(--blue)}
.medico{border-color:var(--red)}
.viaje{border-color:var(--yel)}
.cumple{border-color:var(--pink)}

.etype{font-size:.65rem;color:var(--sub);text-transform:uppercase}
.edate{font-size:.7rem;color:var(--sub)}
.etext{font-size:.9rem;margin:3px 0}

.empty{text-align:center;color:var(--sub);padding:18px;font-size:.8rem}

.actions{display:flex;gap:5px;margin-top:6px}
.actions button{
 background:#333;color:#fff;border:1px solid var(--bor);
 border-radius:5px;padding:6px 9px;font-size:.68rem;cursor:pointer
}

.todaybox{
 border-left:4px solid var(--a);padding-left:9px;margin-bottom:12px
}
.bigday{font-size:1.1rem;font-weight:bold}

.nextbox{
 border-left:4px solid var(--blue);
 padding-left:9px;margin-bottom:10px
}
.nexttitle{
 font-size:1rem;font-weight:bold;color:var(--blue);margin-bottom:8px
}
.nextday{
 color:var(--a);font-size:.82rem;font-weight:bold;
 margin:8px 0 5px
}
.nextitem{
 background:var(--item);border-radius:7px;
 padding:8px;margin-bottom:5px;font-size:.82rem
}
.nexttime{color:var(--sub);font-size:.7rem}
.nexttext{margin-top:2px}

.notice{
 background:#332900;
 border:1px solid var(--yel);
 color:#fff;
 border-radius:8px;
 padding:10px;
 margin-bottom:10px;
 display:none
}
.notice strong{color:var(--yel)}

.modal{
 position:fixed;inset:0;background:#000c;z-index:50;
 padding:12px;overflow:auto
}
.modalbox{
 max-width:600px;margin:20px auto;background:var(--card);
 border:1px solid var(--bor);border-radius:11px;padding:12px
}
</style>
</head>

<body>

<header><h1>📅 MI AGENDA</h1></header>

<div class="container">

<section id="hoy" class="tab active">

<div id="notice" class="notice"></div>

<div class="card">
 <div class="todaybox">
  <div class="bigday" id="todayTitle"></div>
 </div>
 <div id="todayList"></div>
</div>

<!-- NUEVO: PRÓXIMOS AVISOS -->
<div class="card">
 <div class="nextbox">
  <div class="nexttitle">🔔 PRÓXIMOS AVISOS</div>
  <div id="nextList"></div>
 </div>
</div>

<!-- NUEVO: ACTIVAR AVISOS -->
<div class="card">
 <h2>🔔 Avisos</h2>
 <p id="notificationStatus"
    style="color:var(--sub);font-size:.75rem;line-height:1.4;margin-bottom:8px">
    Activa los avisos para recibir la alerta de las 14:00.
 </p>
 <button class="btn out" id="notificationBtn">
  🔔 Activar avisos
 </button>
</div>

<div class="card">
 <h2>➕ Añadir</h2>
 <button class="btn" id="newBtn">Nueva anotación</button>
</div>

</section>


<section id="agenda" class="tab">

<div class="card">
 <div style="display:flex;justify-content:space-between;align-items:center">
  <button class="btn out sm" id="prev">❮</button>
  <h2 id="monthTitle"></h2>
  <button class="btn out sm" id="next">❯</button>
 </div>
 <div class="calendar" id="calendar"></div>
</div>

<div class="card">
 <h2 id="dayTitle"></h2>
 <div id="dayList"></div>
 <button class="btn" id="dayNew">＋ Añadir a este día</button>
</div>

</section>


<section id="ajustes" class="tab">

<div class="card">
 <h2>⚙️ Ajustes</h2>
 <button class="btn out" id="export">💾 Exportar agenda</button>
 <br><br>
 <button class="btn out" id="importBtn">📥 Importar agenda</button>
 <input id="file" type="file" accept=".json" style="display:none">
</div>

<div class="card">
 <h2>ℹ️ Mi Agenda</h2>
 <p style="color:var(--sub);font-size:.78rem;line-height:1.5">
 Agenda personal sencilla. Los datos se guardan automáticamente en este dispositivo.
 </p>
</div>

</section>

</div>


<nav>
<button id="navHoy" class="active">🏠<br>Hoy</button>
<button id="navAgenda">📅<br>Agenda</button>
<button id="navAjustes">⚙️<br>Ajustes</button>
</nav>


<script>
"use strict";

const KEY="mi_agenda_v4";

let events=[];
try{
 events=JSON.parse(localStorage.getItem(KEY)||"[]")
}catch(e){
 events=[]
}

let view=new Date(),
    selected=today(),
    editId=null;


/* =========================
   FUNCIONES GENERALES
========================= */

const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m])
);


function today(){
 let d=new Date();
 return d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-"+
        String(d.getDate()).padStart(2,"0")
}


function addDays(dateString,days){
 let d=new Date(dateString+"T12:00:00");
 d.setDate(d.getDate()+days);
 return d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-"+
        String(d.getDate()).padStart(2,"0")
}


function save(){
 localStorage.setItem(KEY,JSON.stringify(events))
}


function fmt(s){
 return new Date(s+"T12:00:00").toLocaleDateString(
  "es-ES",
  {day:"2-digit",month:"2-digit",year:"numeric"}
 )
}


const names={
 cita:"🔵 Cita",
 cumple:"🎂 Cumpleaños",
 medico:"🩺 Médico",
 viaje:"✈️ Viaje"
};


/* =========================
   NAVEGACIÓN
========================= */

function showTab(n){

 ["hoy","agenda","ajustes"].forEach(
  x=>$(x).classList.toggle("active",x===n)
 );

 ["navHoy","navAgenda","navAjustes"].forEach(
  (x,i)=>$(x).classList.toggle(
   "active",
   ["hoy","agenda","ajustes"][i]===n
  )
 );

 if(n==="hoy"){
  renderToday();
  renderNext();
 }

 if(n==="agenda"){
  renderCalendar()
 }
}


$("navHoy").onclick=()=>showTab("hoy");
$("navAgenda").onclick=()=>showTab("agenda");
$("navAjustes").onclick=()=>showTab("ajustes");


/* =========================
   EVENTOS ANUALES
========================= */

function allEvents(){

 let a=[...events],
     y=new Date().getFullYear();

 events.filter(
  e=>e.repeat&&e.type==="cumple"
 ).forEach(e=>{

  for(let i=-1;i<4;i++){

   a.push({
    ...e,
    id:"rep_"+e.id+"_"+(y+i),
    date:(y+i)+"-"+e.date.slice(5)
   });

  }

 });

 return a
}


/* =========================
   TARJETA DE EVENTO
========================= */

function card(e){

 return '<div class="event '+e.type+'" data-id="'+esc(e.id)+'">'+

 '<div class="etype">'+
 names[e.type]+
 (e.repeat?" · ANUAL":"")+
 '</div>'+

 '<div class="edate">'+
 (e.time?e.time+" · ":"")+
 fmt(e.date)+
 '</div>'+

 '<div class="etext">'+
 esc(e.text)+
 '</div>'+

 (e.note?
  '<div style="font-size:.72rem;color:var(--sub)">'+
  esc(e.note)+
  '</div>':
  '')+

 '<div class="actions">'+

 '<button class="editBtn" data-id="'+esc(e.id)+'">'+
 '✏️ Editar'+
 '</button>'+

 '<button class="deleteBtn" data-id="'+esc(e.id)+'">'+
 '🗑️ Borrar'+
 '</button>'+

 '</div></div>'
}


/* =========================
   PANTALLA HOY
========================= */

function renderToday(){

 let d=new Date();

 $("todayTitle").textContent=
  d.toLocaleDateString(
   "es-ES",
   {
    weekday:"long",
    day:"numeric",
    month:"long"
   }
  );

 let a=allEvents()
  .filter(e=>e.date>=today())
  .sort(
   (a,b)=>
   (a.date+(a.time||""))
   .localeCompare(
    b.date+(b.time||"")
   )
  )
  .slice(0,10);

 $("todayList").innerHTML=
  a.length?
  a.map(card).join(""):

  '<div class="empty">'+
  'No tienes nada pendiente. 👍'+
  '</div>';

 updateNotificationStatus();
}


/* =========================
   NUEVO:
   PRÓXIMOS DOS DÍAS
========================= */

function renderNext(){

 let t=today();
 let manana=addDays(t,1);
 let pasado=addDays(t,2);

 let a=allEvents()
  .filter(e=>e.date===manana||e.date===pasado)
  .sort(
   (x,y)=>
   (x.date+(x.time||""))
   .localeCompare(
    y.date+(y.time||"")
   )
  );

 if(!a.length){

  $("nextList").innerHTML=
   '<div class="empty">'+
   'No hay avisos para mañana ni pasado mañana. 👍'+
   '</div>';

  return
 }

 let html="";

 [manana,pasado].forEach((fecha,i)=>{

  let lista=a.filter(e=>e.date===fecha);

  if(!lista.length)return;

  let d=new Date(fecha+"T12:00:00");

  let titulo=
   i===0?
   "MAÑANA — "+
   d.toLocaleDateString(
    "es-ES",
    {weekday:"long",day:"numeric",month:"long"}
   ):
   "PASADO MAÑANA — "+
   d.toLocaleDateString(
    "es-ES",
    {weekday:"long",day:"numeric",month:"long"}
   );

  html+=
   '<div class="nextday">'+
   titulo+
   '</div>';

  lista.forEach(e=>{

   html+=
    '<div class="nextitem">'+

    '<div>'+
    names[e.type]+
    '</div>'+

    '<div class="nexttext">'+
    esc(e.text)+
    '</div>'+

    (e.time?
     '<div class="nexttime">⏰ '+esc(e.time)+'</div>':
     '')+

    '</div>';

  });

 });

 $("nextList").innerHTML=html
}


/* =========================
   CALENDARIO
========================= */

function renderCalendar(){

 let y=view.getFullYear(),
     m=view.getMonth(),
     first=(new Date(y,m,1).getDay()+6)%7,
     days=new Date(y,m+1,0).getDate(),
     a=allEvents();

 $("monthTitle").textContent=
  view.toLocaleDateString(
   "es-ES",
   {month:"long",year:"numeric"}
  );

 let h=
  ["Lu","Ma","Mi","Ju","Vi","Sá","Do"]
  .map(x=>'<div class="week">'+x+"</div>")
  .join("");

 for(let i=0;i<first;i++)
  h+="<div></div>";

 for(let d=1;d<=days;d++){

  let z=
   y+"-"+
   String(m+1).padStart(2,"0")+"-"+
   String(d).padStart(2,"0");

  let es=a.filter(e=>e.date===z);

  let dots=
   es.length?
   '<div class="dot">'+
   es.map(
    e=>
    e.type==="cita"?"🔵":
    e.type==="cumple"?"🎂":
    e.type==="medico"?"🩺":"✈️"
   ).join("")+
   '</div>':
   "";

  h+=
   '<div class="cal '+
   (z===today()?"today ":"")+
   (z===selected?"sel":"")+
   '" data-date="'+z+'">'+
   d+dots+
   "</div>";
 }

 $("calendar").innerHTML=h;

 document.querySelectorAll(
  ".cal[data-date]"
 ).forEach(x=>
  x.onclick=()=>{
   selected=x.dataset.date;
   renderCalendar()
  }
 );

 renderDay()
}


/* =========================
   DÍA SELECCIONADO
========================= */

function renderDay(){

 let d=new Date(selected+"T12:00:00");

 $("dayTitle").textContent=
  d.toLocaleDateString(
   "es-ES",
   {
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
   }
  );

 let a=allEvents()
  .filter(e=>e.date===selected)
  .sort(
   (a,b)=>
   (a.time||"")
   .localeCompare(b.time||"")
  );

 $("dayList").innerHTML=
  a.length?
  a.map(card).join(""):
  '<div class="empty">'+
  'No hay anotaciones para este día.'+
  '</div>'
}


/* =========================
   BOTONES CALENDARIO
========================= */

$("prev").onclick=()=>{
 view.setMonth(view.getMonth()-1);
 renderCalendar()
};

$("next").onclick=()=>{
 view.setMonth(view.getMonth()+1);
 renderCalendar()
};

$("newBtn").onclick=()=>openForm(today(),null);
$("dayNew").onclick=()=>openForm(selected,null);


/* =========================
   EDITAR Y BORRAR
========================= */

document.addEventListener(
 "click",
 function(e){

  let b=e.target.closest(
   ".editBtn,.deleteBtn"
  );

  if(!b)return;

  let id=b.getAttribute("data-id");

  let x=events.find(
   a=>String(a.id)===String(id)
  );

  if(!x){

   alert(
    "No se puede modificar esta repetición anual."
   );

   return
  }

  if(b.classList.contains("editBtn")){

   openForm(x.date,x);
   return
  }

  if(
   b.classList.contains("deleteBtn")&&
   confirm("¿Borrar esta anotación?")
  ){

   events=events.filter(
    a=>String(a.id)!==String(id)
   );

   save();

   renderToday();
   renderNext();
   renderCalendar()
  }

 }
);


/* =========================
   FORMULARIO
========================= */

function openForm(date,e){

 editId=e?e.id:null;

 let m=document.createElement("div");

 m.className="modal";

 m.innerHTML=
 '<div class="modalbox">'+

 '<h2>'+
 (editId?
  "✏️ Editar anotación":
  "➕ Nueva anotación")+
 '</h2>'+

 '<label>Tipo</label>'+

 '<select id="ft">'+

 '<option value="cita">🔵 Cita</option>'+
 '<option value="cumple">🎂 Cumpleaños</option>'+
 '<option value="medico">🩺 Médico</option>'+
 '<option value="viaje">✈️ Viaje</option>'+

 '</select>'+

 '<label>Fecha</label>'+

 '<input id="fd" type="date" value="'+
 date+
 '">' +

 '<label>Hora</label>'+

 '<input id="fh" type="time" value="'+
 (e&&e.time||"")+
 '">' +

 '<label>Descripción</label>'+

 '<input id="fx" placeholder="¿Qué tienes previsto?" value="'+
 esc(e&&e.text||"")+
 '">' +

 '<label>Notas</label>'+

 '<textarea id="fn" placeholder="Detalles...">'+
 esc(e&&e.note||"")+
 '</textarea>'+

 '<label id="rl" style="display:none">'+

 '<input id="fr" type="checkbox" '+
 (e&&e.repeat?"checked":"")+
 '>'+
 ' Repetir cada año'+

 '</label>'+

 '<div style="display:flex;gap:7px">'+

 '<button class="btn" id="fs">Guardar</button>'+

 '<button class="btn out" id="fc">Cancelar</button>'+

 '</div></div>';

 document.body.appendChild(m);

 $("ft").value=e&&e.type||"cita";

 function rep(){

  $("rl").style.display=
   $("ft").value==="cumple"?
   "block":
   "none"
 }

 $("ft").onchange=rep;

 rep();

 $("fc").onclick=()=>m.remove();

 $("fs").onclick=()=>{

  let text=$("fx").value.trim();

  if(!text){

   alert("Escribe una descripción.");
   return
  }

  let x={

   id:editId||Date.now(),

   type:$("ft").value,

   date:$("fd").value,

   time:$("fh").value,

   text:text,

   note:$("fn").value.trim(),

   repeat:
    $("ft").value==="cumple"&&
    $("fr").checked
  };

  if(editId){

   events=events.map(
    a=>
    String(a.id)===String(editId)?
    x:a
   )

  }else{

   events.push(x)

  }

  save();

  selected=x.date;

  view=new Date(x.date+"T12:00:00");

  m.remove();

  renderToday();
  renderNext();
  renderCalendar();

  checkAlerts();

 }

}


/* =========================
   EXPORTAR
========================= */

$("export").onclick=()=>{

 let b=new Blob(
  [
   JSON.stringify(
    {version:4,events},
    null,
    2
   )
  ],
  {type:"application/json"}
 );

 let a=document.createElement("a");

 a.href=URL.createObjectURL(b);

 a.download=
  "mi_agenda_"+today()+".json";

 a.click();

 setTimeout(
  ()=>URL.revokeObjectURL(a.href),
  1000
 )
};


/* =========================
   IMPORTAR
========================= */

$("importBtn").onclick=()=>
 $("file").click();


$("file").onchange=e=>{

 let f=e.target.files[0];

 if(!f)return;

 let r=new FileReader();

 r.onload=()=>{

  try{

   let d=JSON.parse(r.result);

   if(!Array.isArray(d.events))
    throw 0;

   events=d.events;

   save();

   renderToday();
   renderNext();
   renderCalendar();

   alert(
    "Agenda importada correctamente."
   );

  }catch(x){

   alert("Archivo no válido.")

  }

 };

 r.readAsText(f)
};


/* =================================================
   SISTEMA DE AVISOS
================================================= */


/* Estado del aviso diario */

function alertKey(){

 return "agenda_aviso_"+today()
}


/* Eventos de mañana */

function tomorrowEvents(){

 let manana=addDays(today(),1);

 return allEvents()
  .filter(e=>e.date===manana)
  .sort(
   (a,b)=>
   (a.time||"")
   .localeCompare(b.time||"")
  )
}


/* Mostrar aviso */

function showAlertMessage(lista){

 if(!lista.length)return;

 let texto=
  "🔔 AVISO\n\n"+
  "Mañana tienes:\n\n";

 lista.forEach(e=>{

  texto+=
   (e.time?
    "⏰ "+e.time+" — ":
    "• ")+
   e.text+
   "\n";

 });

 $("notice").innerHTML=
  "<strong>🔔 AVISO</strong><br><br>"+
  "Mañana tienes:<br>"+
  lista.map(
   e=>
   (e.time?
    "⏰ "+esc(e.time)+" — ":
    "• ")+
   esc(e.text)
  ).join("<br>");

 $("notice").style.display="block";

 /* Alerta visible */

 alert(texto);

}


/* =================================================
   SONIDO
================================================= */

function playAlertSound(){

 try{

  let AudioContext=
   window.AudioContext||
   window.webkitAudioContext;

  if(!AudioContext)return;

  let ctx=new AudioContext();

  let now=ctx.currentTime;

  for(let i=0;i<3;i++){

   let osc=ctx.createOscillator();
   let gain=ctx.createGain();

   osc.type="sine";

   osc.frequency.value=
    i===0?880:
    i===1?1100:
    880;

   gain.gain.setValueAtTime(
    0.0001,
    now+i*0.35
   );

   gain.gain.exponentialRampToValueAtTime(
    0.35,
    now+i*0.35+0.03
   );

   gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+i*0.35+0.28
   );

   osc.connect(gain);
   gain.connect(ctx.destination);

   osc.start(now+i*0.35);

   osc.stop(now+i*0.35+0.3);
  }

 }catch(e){}

}


/* =================================================
   NOTIFICACIONES ANDROID
================================================= */

function updateNotificationStatus(){

 if(!("Notification" in window)){

  $("notificationStatus").textContent=
   "Este navegador no permite notificaciones web.";

  $("notificationBtn").style.display="none";

  return
 }

 if(Notification.permission==="granted"){

  $("notificationStatus").textContent=
   "✅ Avisos activados. La Agenda puede mostrar notificaciones.";

  $("notificationBtn").textContent=
   "✅ Avisos activados";

 }else if(Notification.permission==="denied"){

  $("notificationStatus").textContent=
   "⚠️ Las notificaciones están bloqueadas. Debes permitirlas desde los ajustes del navegador.";

  $("notificationBtn").textContent=
   "🔔 Permitir avisos";

 }else{

  $("notificationStatus").textContent=
   "Activa los avisos para recibir la alerta de las 14:00.";

  $("notificationBtn").textContent=
   "🔔 Activar avisos";
 }
}


$("notificationBtn").onclick=async()=>{

 if(!("Notification" in window)){

  alert(
   "Este navegador no permite notificaciones."
  );

  return
 }

 try{

  let permission=
   await Notification.requestPermission();

  updateNotificationStatus();

  if(permission==="granted"){

   try{

    new Notification(
     "📅 Mi Agenda",
     {
      body:
       "Los avisos están activados correctamente."
     }
    );

   }catch(e){}

   playAlertSound();

  }

 }catch(e){

  alert(
   "No se ha podido activar el permiso de notificaciones."
  );

 }

};


/* =================================================
   COMPROBAR AVISOS
================================================= */

function checkAlerts(){

 let ahora=new Date();

 /*
  Solo queremos lanzar el aviso aproximadamente
  a las 14:00 del día anterior.

  Permitimos una pequeña ventana entre las 14:00
  y las 14:05 para que no dependa de que el minuto
  exacto sea justo 00.
 */

 let hora=ahora.getHours();
 let minuto=ahora.getMinutes();

 if(hora!==14 || minuto>5)
  return;

 let lista=tomorrowEvents();

 if(!lista.length)
  return;

 let key=alertKey();

 if(localStorage.getItem(key)==="1")
  return;

 localStorage.setItem(key,"1");

 playAlertSound();

 showAlertMessage(lista);

 /* Notificación del navegador */

 if(
  "Notification" in window &&
  Notification.permission==="granted"
 ){

  lista.forEach(e=>{

   try{

    new Notification(
     "🔔 Mi Agenda — Mañana",
     {
      body:
       (e.time?
        e.time+" — ":"")+
       e.text
     }
    );

   }catch(err){}

  });

 }

}


/* =================================================
   COMPROBACIÓN PERIÓDICA
================================================= */

setInterval(
 checkAlerts,
 30000
);


/* Comprobar inmediatamente al abrir */

checkAlerts();


/* =================================================
   INICIO
================================================= */

renderToday();
renderNext();
renderCalendar();
updateNotificationStatus();

</script>
